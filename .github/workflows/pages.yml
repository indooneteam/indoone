name: Deploy Indoone Web

on:
  # The web lives on main; terminal carries the app's test builds and its copy
  # of web/ is the old one. Deploying from terminal is why the live site kept
  # showing a navigation bar with Connect in it long after main had lost it.
  push:
    branches:
      - main
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the web folder is publishable
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/update.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
