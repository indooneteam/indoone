name: Deploy Indoone Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
          fetch-depth: 1

      - name: Checkout develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop-source
          fetch-depth: 1

      - name: Validate branding
        run: node main-source/scripts/validate-branding.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build main APK
        run: GITHUB_REF_NAME=main gradle -p main-source/android assembleDebug --stacktrace

      - name: Build develop APK
        run: GITHUB_REF_NAME=develop gradle -p develop-source/android assembleDebug --stacktrace

      - name: Build Pages package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish/downloads publish/main/downloads publish/develop/downloads

          rsync -a --exclude='.git' main-source/ publish/
          rsync -a --exclude='.git' develop-source/ publish/develop/

          MAIN_APK="main-source/android/app/build/outputs/apk/debug/app-debug.apk"
          DEVELOP_APK="develop-source/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$MAIN_APK"
          test -s "$DEVELOP_APK"

          cp "$MAIN_APK" publish/downloads/indoone.apk
          cp "$MAIN_APK" publish/main/downloads/indoone.apk
          cp "$DEVELOP_APK" publish/develop/downloads/indoone.apk

          test -f publish/index.html
          test -f publish/update.json
          test -f publish/downloads/indoone.apk
          test -f publish/main/downloads/indoone.apk
          test -f publish/develop/index.html
          test -f publish/develop/update.json
          test -f publish/develop/downloads/indoone.apk

          echo "Published main at / and /main/; published develop at /develop/."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
