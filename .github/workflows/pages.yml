name: Validate Indoone Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Validate Pages files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f bottom-nav-svg.css
          test -f connect.css
          test -f js/connect.js
          test -f js/events.js
          echo "Indoone develop Pages package is valid."
