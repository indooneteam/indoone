name: Deploy Indoone Web

on:
  push:
    branches:
      - web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout web source
        uses: actions/checkout@v4
        with:
          ref: web
          path: web-source
          fetch-depth: 1

      - name: Build Pages package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          rsync -a --exclude='.git' web-source/ publish/
          test -f publish/index.html
          test -f publish/update.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
