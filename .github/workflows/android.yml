name: Android Build

on:
  push:
    branches: [ main, develop, merge/main-into-develop-prep-2026-09-06 ]
  pull_request:
    branches: [ main, merge/main-into-develop-prep-2026-09-06 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate branding
        run: node scripts/validate-branding.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indoone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
