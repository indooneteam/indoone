name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare stable develop signing key
        if: github.ref == 'refs/heads/develop'
        shell: bash
        env:
          INDOONE_KEYSTORE_BASE64: ${{ secrets.INDOONE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$INDOONE_KEYSTORE_BASE64"
          printf '%s' "$INDOONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/indoone-develop.keystore"
          test -s "$RUNNER_TEMP/indoone-develop.keystore"
      - name: Assemble debug APK
        shell: bash
        env:
          INDOONE_KEYSTORE_PATH: ${{ github.ref == 'refs/heads/develop' && format('{0}/indoone-develop.keystore', runner.temp) || '' }}
          INDOONE_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/develop' && secrets.INDOONE_KEYSTORE_PASSWORD || '' }}
          INDOONE_KEY_ALIAS: ${{ github.ref == 'refs/heads/develop' && secrets.INDOONE_KEY_ALIAS || '' }}
          INDOONE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/develop' && secrets.INDOONE_KEY_PASSWORD || '' }}
        run: gradle assembleDebug --stacktrace
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No debug APK found under android/build/outputs/apk/debug"
            echo "APK files produced anywhere under android/build/outputs:"
            find android/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Found APK: $apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: indoone-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  sync-main-to-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main into develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop
