<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="data-privacy"
>
  <div class="modal-head">
    <h2>Data &amp; Privacy</h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Data and Privacy"
    >
      ×
    </button>
  </div>

  <p class="menu-feature-intro">Your data, your control</p>
  <p class="menu-feature-note">
    See what Indoone stores and how each part is used.
  </p>

  <div class="menu-feature-list">
    <button
      type="button"
      class="settings-row"
      data-privacy-open="profile"
    >
      <span>
        <b>Profile</b>
        <small>Your name, nickname and profession</small>
      </span>
      <b>›</b>
    </button>

    <button
      type="button"
      class="settings-row"
      data-privacy-open="memory"
    >
      <span>
        <b>AI Memory</b>
        <small>What Indoone remembers about you</small>
      </span>
      <b>›</b>
    </button>

    <button
      type="button"
      class="settings-row"
      data-privacy-open="chat-history"
    >
      <span>
        <b>Chat History</b>
        <small>Conversations saved to your account</small>
      </span>
      <b>›</b>
    </button>

    <div class="settings-row">
      <span>
        <b>Storage</b>
        <small>Accounts, profile and memory live in your own Indoone account</small>
      </span>
      <b>✓</b>
    </div>

    <button
      type="button"
      class="settings-row"
      data-privacy-open="security"
    >
      <span>
        <b>Security</b>
        <small>How your data is protected</small>
      </span>
      <b>›</b>
    </button>
  </div>
</section>
