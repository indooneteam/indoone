<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="profile"
>
  <div class="modal-head">
    <h2>Profile</h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Profile"
    >
      ×
    </button>
  </div>

  <p class="menu-feature-intro">Your Indoone profile</p>

  <form
    class="menu-feature-form"
    id="menuProfileForm"
  >
    <label>
      <span>Name</span>
      <input
        type="text"
        id="menuProfileName"
        autocomplete="name"
      />
    </label>

    <label>
      <span>Nickname</span>
      <input
        type="text"
        id="menuProfileNickname"
      />
    </label>

    <label>
      <span>Profession</span>
      <input
        type="text"
        id="menuProfileProfession"
      />
    </label>

    <button
      type="submit"
      class="primary"
      id="menuProfileSave"
    >
      Save profile
    </button>
  </form>

  <p
    class="menu-feature-status"
    id="menuProfileStatus"
  ></p>
</section>
