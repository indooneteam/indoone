<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="chat-history"
>
  <header class="ch-head">
    <button
      type="button"
      class="ch-back"
      data-close
      aria-label="Back"
    >
      <span data-app-icon="arrowBack"></span>
    </button>
    <h2 class="ch-title">Chat History</h2>
    <span
      class="ch-count"
      id="menuChatHistoryCount"
      hidden
    ></span>
  </header>

  <p class="menu-feature-intro">Open a conversation, or remove one.</p>

  <div
    class="menu-feature-list"
    id="menuChatHistoryList"
  ></div>

  <p
    class="menu-feature-status"
    id="menuChatHistoryStatus"
  ></p>
</section>
