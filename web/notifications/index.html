<section
  class="notifications-page"
  data-notifications-page
>
  <div class="notifications-head">
    <button
      type="button"
      class="notifications-back"
      id="notificationsBack"
      aria-label="Back"
    >
      ‹
    </button>

    <h2>Notifications</h2>

    <button
      type="button"
      class="notifications-mark"
      id="notificationsMark"
    >
      Mark all as read
    </button>
  </div>

  <div
    class="notifications-list"
    id="notificationsList"
  ></div>

  <div
    class="notifications-empty"
    id="notificationsEmpty"
    hidden
  >
    <strong>No notifications yet</strong>
    <span>New Indoone alerts will appear here.</span>
  </div>
</section>
