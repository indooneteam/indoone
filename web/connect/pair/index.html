<section
  class="connect-pair-page"
  data-feature="connect-pair"
>
  <button
    type="button"
    class="connect-back"
    aria-label="Back"
    data-pair-action="home"
    data-connect-action="home"
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="m15 5-7 7 7 7"
      />
    </svg>
    <span>
      Back
    </span>
  </button>
  <p
    class="eyebrow"
  >
    DEVICE PAIRING
  </p>
  <h2>
    Pair
  </h2>
  <p
    class="connect-pair-copy"
  >
    Choose how you want to pair this device with another Indoone device.
  </p>
  <div
    class="connect-pair-options"
  >
    <button
      type="button"
      class="connect-pair-option"
      data-pair-action="qr"
    >
      <span
        class="connect-pair-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
        >
          <rect
            x="4"
            y="4"
            width="6"
            height="6"
            rx="1.4"
          />
          <rect
            x="14"
            y="4"
            width="6"
            height="6"
            rx="1.4"
          />
          <rect
            x="4"
            y="14"
            width="6"
            height="6"
            rx="1.4"
          />
          <path
            d="M14 14h3v3h3M14 20v-2M20 14v2"
          />
        </svg>
      </span>
      <span
        class="connect-pair-text"
      >
        <b>
          Show my QR
        </b>
        <small>
          Let the other device scan your pairing QR.
        </small>
      </span>
      <span
        class="connect-pair-arrow"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path
            d="m9 5 7 7-7 7"
          />
        </svg>
      </span>
    </button>
    <button
      type="button"
      class="connect-pair-option"
      data-pair-action="scanner"
    >
      <span
        class="connect-pair-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path
            d="M8 4H5v3M16 4h3v3M20 16v3h-3M8 20H5v-3M8 12h8M12 8v8"
          />
        </svg>
      </span>
      <span
        class="connect-pair-text"
      >
        <b>
          Scan QR
        </b>
        <small>
          Scan another Indoone device to start pairing.
        </small>
      </span>
      <span
        class="connect-pair-arrow"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path
            d="m9 5 7 7-7 7"
          />
        </svg>
      </span>
    </button>
  </div>
  <div
    class="connect-pair-note"
  >
    <b>
      Pairing only
    </b>
    <span>
      Your accounts and files are not shared until you approve permissions.
    </span>
  </div>
</section>
