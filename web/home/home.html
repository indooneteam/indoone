<section
  class="chat-page"
  id="homeContent"
  data-feature="home"
>
  <div
    class="chat-scroll"
    id="chatScroll"
  >
    <div
      class="chat-welcome"
      id="chatWelcome"
    >
      <div
        class="welcome-mark"
        id="welcomeMark"
      ></div>
      <h2>Indoone AI</h2>
      <p id="welcomeLine">Ask me anything.</p>
      <div
        class="quick-prompts"
        id="quickPrompts"
      ></div>
    </div>

    <div
      class="chat-list"
      id="chatList"
    ></div>
  </div>

  <div class="chat-composer">
    <div
      class="pending-attachments"
      id="pendingAttachments"
      hidden
    ></div>

    <div class="composer-row">
      <button
        type="button"
        class="composer-btn"
        id="plusBtn"
        aria-label="Add attachment"
      >
        +
      </button>

      <textarea
        id="chatInput"
        rows="1"
        placeholder="Message Indoone AI"
        aria-label="Message Indoone AI"
      ></textarea>

      <button
        type="button"
        class="composer-btn"
        id="voiceBtn"
        aria-label="Speak your message"
      >
        ◉
      </button>

      <button
        type="button"
        class="composer-send"
        id="sendBtn"
        aria-label="Send message"
      >
        ➤
      </button>
    </div>
  </div>
</section>
