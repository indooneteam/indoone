<div
  class="plus-sheet"
  id="plusSheet"
  hidden
>
  <div class="plus-sheet-card">
    <span class="plus-grip"></span>

    <button
      type="button"
      class="plus-option"
      data-plus="camera"
    >
      <span class="plus-icon">◉</span>
      <span>
        <b>Camera</b>
        <small>Take a photo now</small>
      </span>
    </button>

    <button
      type="button"
      class="plus-option"
      data-plus="photos"
    >
      <span class="plus-icon">▣</span>
      <span>
        <b>Photos</b>
        <small>Choose from your device</small>
      </span>
    </button>

    <button
      type="button"
      class="plus-option"
      data-plus="files"
    >
      <span class="plus-icon">⌘</span>
      <span>
        <b>Files</b>
        <small>Attach a document</small>
      </span>
    </button>
  </div>
</div>
