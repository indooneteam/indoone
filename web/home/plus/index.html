<div
  class="plus-sheet"
  id="plusSheet"
  hidden
>
  <div class="plus-sheet-card">
    <span class="plus-grip"></span>

    <button
      type="button"
      class="plus-option"
      data-plus="camera"
    >
      <span class="plus-icon" data-app-icon="photoCamera" data-app-icon-class="app-icon"></span>
      <span>
        <b>Camera</b>
      </span>
    </button>

    <button
      type="button"
      class="plus-option"
      data-plus="photos"
    >
      <span class="plus-icon" data-app-icon="photo" data-app-icon-class="app-icon"></span>
      <span>
        <b>Photos</b>
      </span>
    </button>

    <button
      type="button"
      class="plus-option"
      data-plus="files"
    >
      <span class="plus-icon" data-app-icon="attachFile" data-app-icon-class="app-icon"></span>
      <span>
        <b>Files</b>
        <small>PDFs, Docs, Videos, Audio, and more</small>
      </span>
    </button>
  </div>
</div>
