<section
  data-menu-feature
  data-menu-section="update"
  class="menu-feature-shell update-page"
>
  <div class="modal-head">
    <h2>
      Check for updates
    </h2>
    <button
      class="close-btn"
      type="button"
      data-close
      aria-label="Close"
    >
      ×
    </button>
  </div>

  <p
    class="update-status"
    data-update-status
  >
    Checking for updates…
  </p>

  <div class="update-meta">
    <div class="update-meta-row">
      <span>
        This app
      </span>
      <strong data-update-current>
        —
      </strong>
    </div>

    <div class="update-meta-row">
      <span>
        Latest build
      </span>
      <strong data-update-latest>
        —
      </strong>
    </div>
  </div>

  <a
    class="update-download"
    data-update-download
    href="https://github.com/indooneteam/indoone/releases/latest"
    target="_blank"
    rel="noopener"
    hidden
  >
    Download the update
  </a>

  <button
    type="button"
    class="update-done"
    data-close
  >
    Done
  </button>
</section>
