<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="logout"
>
  <div
    class="modal-head"
  >
    <h2>
      Log out
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Log out"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    Sign out from this device.
  </p>
  <div
    class="menu-feature-list"
  >
    <button
      type="button"
      class="settings-row menu-feature-row"
      data-open-nested="logout/this-device"
    >
      <span
        class="menu-feature-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
        >
          <rect
            x="5"
            y="8"
            width="14"
            height="11"
            rx="2"
          >
          </rect>
          <path
            d="M8 8V6.5a4 4 0 0 1 8 0V8"
          >
          </path>
        </svg>
      </span>
      <span>
        Log out on this device
        <small>
          Sign out only from this device
        </small>
      </span>
      <b
        aria-hidden="true"
      >
        ›
      </b>
    </button>
  </div>
  <button
    type="button"
    class="secondary"
    data-close
  >
    Cancel
  </button>
</section>
