<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="delete-account"
>
  <div
    class="modal-head"
  >
    <!-- DangerModalShell(onBack, title = null) falls back to "Danger Zone",
         and the delete screen does not pass a title, so this is the app's own
         heading. The note below is the app's own sentence, verbatim. -->
    <h2>
      Danger Zone
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Danger Zone"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    This permanently deletes your Indoone account, your cloud data and
    everything stored on this device. This action cannot be undone.
  </p>
  <div
    class="field"
  >
    <label
      for="deleteAccountPassword"
    >
      ACCOUNT PASSWORD
    </label>
    <input
      id="deleteAccountPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Enter your password"
    >
  </div>
  <div
    class="field"
  >
    <label
      for="deleteAccountConfirm"
    >
      TYPE DELETE TO CONFIRM
    </label>
    <input
      id="deleteAccountConfirm"
      type="text"
      autocomplete="off"
      placeholder="DELETE"
      autocapitalize="characters"
      spellcheck="false"
    >
  </div>
  <div
    id="accountDeleteStatus"
    class="auth-status"
    hidden
  >
  </div>
  <div
    class="menu-feature-actions"
  >
    <button
      type="button"
      class="primary danger"
      id="confirmAccountDelete"
    >
      Delete Indoone account
    </button>
    <button
      type="button"
      class="secondary"
      data-close
    >
      Cancel
    </button>
  </div>
</section>
