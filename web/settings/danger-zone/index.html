<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="danger-zone"
>
  <!-- DangerZoneScreen.kt draws one row, not two. The web carried a second
       one, "Delete local data", which the app has never had: the app's only
       DangerRow is
         DangerRow("Delete Indoone account",
                   "Permanently delete your Indoone account, cloud data and local files",
                   onDeleteAccount)
       and the note above it reads
         "This permanently removes your Indoone account, your cloud data, and
          everything Indoone keeps on this device. Continue only when you are
          sure."
       Both are used here verbatim. -->
  <div
    class="modal-head"
  >
    <h2>
      Danger Zone
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Danger Zone"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    This permanently removes your Indoone account, your cloud data, and
    everything Indoone keeps on this device. Continue only when you are sure.
  </p>
  <div
    class="menu-feature-list"
  >
    <button
      type="button"
      class="settings-row danger menu-feature-row"
      data-open-nested="danger-zone/delete-account"
    >
      <span>
        Delete Indoone account
        <small>
          Permanently delete your Indoone account, cloud data and local files
        </small>
      </span>
      <b>
        ›
      </b>
    </button>
  </div>
</section>
