<section
  class="settings-subpage profile-page"
>
  <div class="modal-head">
    <h2>
      Profile
    </h2>
    <button
      class="close-btn"
      type="button"
      data-close
      aria-label="Close"
    >
      ×
    </button>
  </div>

  <div class="profile-card">
    <div class="profile-avatar">
      P
    </div>
    <div>
      <h3 id="profileEmail">
        Account
      </h3>
      <small id="profilePhone">
        Mobile number not set
      </small>
    </div>
  </div>

  <div class="profile-actions">
    <button
      type="button"
      class="settings-row settings-row-button"
      data-profile-action="mobile"
    >
      <span>
        Change mobile number
        <small>
          Update your verified phone number
        </small>
      </span>
      <span class="settings-arrow">
        ›
      </span>
    </button>

    <button
      type="button"
      class="settings-row settings-row-button"
      data-profile-action="email"
    >
      <span>
        Change email
        <small>
          Update your account email address
        </small>
      </span>
      <span class="settings-arrow">
        ›
      </span>
    </button>
  </div>
</section>
