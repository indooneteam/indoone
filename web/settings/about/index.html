<section
  class="settings-subpage about-page"
>
  <div class="modal-head">
    <h2>
      About Indoone
    </h2>
    <button
      class="close-btn"
      type="button"
      data-close
      aria-label="Close"
    >
      ×
    </button>
  </div>

  <div class="about-meta">
    <div
      class="about-meta-row about-meta-row-link"
      data-about-action="updates"
      role="button"
      tabindex="0"
    >
      <span>
        Updates
      </span>
      <strong>
        Check for updates
      </strong>
    </div>
  </div>

  <button
    type="button"
    class="about-done"
    data-close
  >
    Done
  </button>
</section>
