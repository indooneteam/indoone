<section
  class="menu-feature-shell about-page"
  data-menu-feature
  data-menu-section="settings-about"
>
  <div
    class="modal-head"
  >
    <h2>
      About Indoone
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close About Indoone"
    >
      ×
    </button>
  </div>

  <div
    class="about-meta"
  >
    <div
      class="about-meta-row"
    >
      <span>
        Version
      </span>
      <strong
        data-about-version
      >
        —
      </strong>
    </div>

    <button
      type="button"
      class="about-meta-row about-meta-button"
      data-about-updates
    >
      <span>
        Updates
      </span>
      <strong>
        Check for updates
      </strong>
    </button>
  </div>

  <button
    type="button"
    class="about-done"
    data-close
  >
    Done
  </button>
</section>
