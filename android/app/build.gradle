plugins { id 'com.android.application' }

android {
    namespace 'com.indoone.authenticator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.indoone.authenticator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../..']
        }
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
}
