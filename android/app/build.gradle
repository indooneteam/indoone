plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.indoone.authenticator'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId 'com.indoone.authenticator'
        versionCode 30
        versionName '2.1.18'
        minSdk 26
        targetSdk 35

        def channel = System.getenv('GITHUB_REF_NAME') == 'develop' ? 'develop' : 'main'
        def backendUrl = System.getenv('INDOONE_BACKEND_URL') ?: 'http://10.0.2.2:8000'
        buildConfigField 'String', 'INDOONE_CHANNEL', "\"${channel}\""
        buildConfigField 'String', 'INDOONE_BACKEND_URL', "\"${backendUrl}\""
    }

    signingConfigs {
        create('developStable') {
            def keystorePath = System.getenv('INDOONE_KEYSTORE_PATH')
            def storePassword = System.getenv('INDOONE_KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('INDOONE_KEY_ALIAS')
            def keyPassword = System.getenv('INDOONE_KEY_PASSWORD')
            if (keystorePath && storePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                this.storePassword = storePassword
                this.keyAlias = keyAlias
                this.keyPassword = keyPassword
            }
        }
    }

    buildTypes {
        debug {
            def keystorePath = System.getenv('INDOONE_KEYSTORE_PATH')
            def storePassword = System.getenv('INDOONE_KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('INDOONE_KEY_ALIAS')
            def keyPassword = System.getenv('INDOONE_KEY_PASSWORD')
            if (keystorePath && storePassword && keyAlias && keyPassword) {
                signingConfig = signingConfigs.getByName('developStable')
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
}
