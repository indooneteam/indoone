plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indoone.authenticator'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.indoone.authenticator'
        versionCode 11
        versionName '2.0'
        minSdk 26
        targetSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets {
                srcDirs = [file("${layout.buildDirectory.get()}/generated/indooneAssets")]
            }
            res.srcDir(file("${layout.buildDirectory.get()}/generated/exactBranding/res"))
        }
    }
}

def normalizeMainActivityInsets = tasks.register('normalizeMainActivityInsets') {
    doLast {
        File source = file("$projectDir/src/main/java/com/indoone/authenticator/MainActivity.java")
        String text = source.getText('UTF-8')
        String broken = '''            WindowInsetsCompat systemBars =
                    insets.getInsets(WindowInsetsCompat.Type.systemBars());

            lastTopInset = systemBars.top;
            lastBottomInset = systemBars.bottom;'''
        String fixed = '''            androidx.core.graphics.Insets systemBars =
                    insets.getInsets(WindowInsetsCompat.Type.systemBars());

            lastTopInset = systemBars.top;
            lastBottomInset = systemBars.bottom;'''

        if (text.contains(broken)) {
            source.setText(text.replace(broken, fixed), 'UTF-8')
        }
    }
}

def prepareIndooneWebAssets = tasks.register('prepareIndooneWebAssets', Sync) {
    from(file("$rootDir/..")) {
        include 'index.html'
        include 'update.json'
        include '*.css'
        include 'js/**'
        include 'app/**'
        include 'assets/**'
    }
    into(layout.buildDirectory.dir('generated/indooneAssets'))
}

def prepareIndooneExactLogo = tasks.register('prepareIndooneExactLogo') {
    inputs.files(
        file("$rootDir/../assets/branding/exact-logo/part-01.txt"),
        file("$rootDir/../assets/branding/exact-logo/part-02.txt")
    )
    outputs.file(file("${layout.buildDirectory.get()}/generated/exactBranding/res/drawable/indoone_exact_logo.png"))

    doLast {
        File sourceDir = file("$rootDir/../assets/branding/exact-logo")
        String base64 = [1, 2].collect { index ->
            file("$sourceDir/part-${String.format('%02d', index)}.txt").getText('UTF-8')
        }.join('').replaceAll(/\s+/, '')

        byte[] png = java.util.Base64.decoder.decode(base64)
        File output = file("${layout.buildDirectory.get()}/generated/exactBranding/res/drawable/indoone_exact_logo.png")
        output.parentFile.mkdirs()
        output.bytes = png
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /compile.*JavaWithJavac/) {
        task.dependsOn(normalizeMainActivityInsets)
    }

    if (task.name ==~ /merge.*Assets/) {
        task.dependsOn(prepareIndooneWebAssets)
    }

    if (task.name ==~ /merge.*Resources/ || task.name ==~ /generate.*Resources/ || task.name ==~ /map.*SourceSetPaths/) {
        task.dependsOn(prepareIndooneExactLogo)
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-nearby:19.5.0'
}
