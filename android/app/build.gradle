plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indoone.authenticator'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.indoone.authenticator'
        versionCode 11
        versionName '2.0'
        minSdk 26
        targetSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets {
                srcDirs = [file("${layout.buildDirectory.get()}/generated/indooneAssets")]
            }
        }
    }
}

def prepareIndooneWebAssets = tasks.register('prepareIndooneWebAssets', Sync) {
    from(file("$rootDir/..")) {
        include 'index.html'
        include 'update.json'
        include '*.css'
        include 'js/**'
        include 'app/**'
        include 'assets/**'
    }
    into(layout.buildDirectory.dir('generated/indooneAssets'))
}

tasks.configureEach { task ->
    if (task.name ==~ /merge.*Assets/) {
        task.dependsOn(prepareIndooneWebAssets)
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-nearby:19.5.0'
}
