<section class="connect-feature device-connect-feature">
  <div class="modal-head">
    <div>
      <p class="eyebrow">NEW CONNECTION</p>
      <h2>Connect a device</h2>
    </div>

    <button
      type="button"
      class="close-btn"
      data-device-connect-close
      aria-label="Close"
    >
      ×
    </button>
  </div>

  <p class="connect-muted">
    Choose the nearby device you want to connect.
  </p>

  <div class="device-target-list">
    <button
      type="button"
      class="device-target"
      data-device-target="phone"
    >
      <span>📱</span>
      <strong>Another phone</strong>
      <small>Phone-to-phone nearby connection</small>
      <b>›</b>
    </button>

    <button
      type="button"
      class="device-target"
      data-device-target="computer"
    >
      <span>💻</span>
      <strong>Laptop / PC</strong>
      <small>Phone-to-computer nearby connection</small>
      <b>›</b>
    </button>
  </div>

  <div class="connect-note">
    Connecting a device does not automatically give it access to your data.
  </div>
</section>
