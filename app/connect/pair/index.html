<section class="connect-pair-page" data-feature="connect-pair">
  <button type="button" class="connect-back" aria-label="Back" data-pair-action="home" data-connect-action="home"></button>
  <p class="eyebrow">DEVICE PAIRING</p>
  <h2>Pair</h2>
  <p class="connect-pair-copy">Choose how you want to pair this device with another Indoone device.</p>
  <div class="connect-pair-options">
    <button type="button" class="connect-pair-option" data-pair-action="qr">
      <span class="connect-pair-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14.5" y="3.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="14.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 14.5h3v3h3M14.5 20.5v-2M20.5 14.5v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="connect-pair-text"><b>Show my QR</b><small>Let the other device scan your pairing QR.</small></span>
      <span class="connect-pair-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <button type="button" class="connect-pair-option" data-pair-action="scanner">
      <span class="connect-pair-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 8V5h3M16 5h3v3M19 16v3h-3M8 19H5v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 12h8M12 8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span class="connect-pair-text"><b>Scan QR</b><small>Scan another Indoone device to start pairing.</small></span>
      <span class="connect-pair-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>
  <div class="connect-pair-note">
    <b>Pairing only</b>
    <span>Your accounts and files are not shared until you approve permissions.</span>
  </div>
</section>
