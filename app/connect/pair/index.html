<section class="connect-pair-page" data-feature="connect-pair">
  <button type="button" class="connect-back" aria-label="Back" data-pair-action="home" data-connect-action="home"></button>
  <p class="eyebrow">DEVICE PAIRING</p>
  <h2>Pair</h2>
  <p class="connect-pair-copy">Choose how you want to pair this device with another Indoone device.</p>
  <div class="connect-pair-options">
    <button type="button" class="connect-pair-option" data-pair-action="qr">
      <span class="connect-pair-icon">▦</span>
      <span class="connect-pair-text"><b>Show my QR</b><small>Let the other device scan your pairing QR.</small></span>
      <span class="connect-pair-arrow">›</span>
    </button>
    <button type="button" class="connect-pair-option" data-pair-action="scanner">
      <span class="connect-pair-icon">⌗</span>
      <span class="connect-pair-text"><b>Scan QR</b><small>Scan another Indoone device to start pairing.</small></span>
      <span class="connect-pair-arrow">›</span>
    </button>
  </div>
  <div class="connect-pair-note">
    <b>Pairing only</b>
    <span>Your accounts and files are not shared until you approve permissions.</span>
  </div>
</section>
