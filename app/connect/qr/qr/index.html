<section class="connect-feature qr-feature">
  <div class="modal-head">
    <div>
      <p class="eyebrow">PAIR THIS DEVICE</p>
      <h2>My QR Code</h2>
    </div>
    <button type="button" class="close-btn" data-qr-close aria-label="Close QR">×</button>
  </div>

  <div id="connectQrVisual" class="qr-visual" aria-label="Indoone pairing QR"></div>
  <p id="connectQrDeviceName" class="connect-muted center"></p>
  <p id="connectQrCode" class="connect-muted center"></p>
  <div id="connectQrCodeLarge" class="qr-code-large"></div>

  <p id="connectQrStatus" class="connect-muted center">
    Show this QR to another Indoone device.
  </p>

  <button type="button" class="secondary" data-qr-copy>Copy pairing code</button>
  <button type="button" class="primary" data-qr-close>Done</button>
</section>
