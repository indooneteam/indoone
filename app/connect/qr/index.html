<section class="connect-feature qr-feature">
  <div class="modal-head">
    <div><p class="eyebrow">PAIR THIS DEVICE</p><h2>My QR Code</h2></div>
    <button type="button" class="close-btn" data-connect-close aria-label="Close QR code">×</button>
  </div>
  <div class="qr-feature-card">
    <div id="connectQrVisual" class="qr-feature-visual" aria-label="Indoone pairing QR"></div>
    <div class="qr-feature-identity">
      <div class="qr-feature-avatar">I</div>
      <div><strong id="connectQrDeviceName">Indoone Device</strong><small id="connectQrCode">Pairing code</small></div>
    </div>
  </div>
  <div class="qr-feature-code-wrap">
    <span>Pairing code</span>
    <strong id="connectQrCodeLarge">--------</strong>
    <button type="button" class="secondary" data-connect-copy>Copy code</button>
  </div>
  <p class="connect-muted">Scan this code from another Indoone device to start pairing.</p>
  <button type="button" class="primary" data-connect-close>Done</button>
</section>
