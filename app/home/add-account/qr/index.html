<section class="add-account-child qr-page" data-feature="home-add-account-qr">
  <div class="child-page-header">
    <button
      type="button"
      class="page-back"
      data-qr-action="back"
      aria-label="Back to Add Account"
    >
      <span aria-hidden="true">‹</span>
      <span>Back</span>
    </button>

    <div>
      <p class="eyebrow">ADD ACCOUNT</p>
      <h1>Scan QR Code</h1>
      <p>Place the TOTP QR code inside the frame.</p>
    </div>
  </div>

  <div class="qr-scanner-shell">
    <video
      id="addAccountQrVideo"
      class="qr-video"
      autoplay
      playsinline
      muted
    ></video>
    <div class="qr-scan-frame" aria-hidden="true"></div>
  </div>

  <p class="qr-status" id="addAccountQrStatus">
    Starting camera…
  </p>

  <button
    type="button"
    class="secondary"
    data-qr-action="cancel"
  >
    Cancel Scan
  </button>
</section>
