<section class="add-account-page" data-feature="home-add-account">
  <button
    type="button"
    class="add-account-back"
    data-add-action="back"
    aria-label="Back to accounts"
  >
    <span class="back-icon" aria-hidden="true">‹</span>
    <span>Back</span>
  </button>

  <div class="page-heading">
    <div>
      <p class="eyebrow">NEW AUTHENTICATOR</p>
      <h1>Add Account</h1>
      <p>Choose how you want to add your TOTP account.</p>
    </div>
  </div>

  <div class="add-account-options">
    <button
      type="button"
      class="add-account-option"
      data-add-action="scan"
    >
      <span aria-hidden="true">▦</span>
      <strong>Scan QR Code</strong>
      <small>Use your camera to scan a TOTP QR code.</small>
    </button>

    <button
      type="button"
      class="add-account-option"
      data-add-action="manual"
    >
      <span aria-hidden="true">⌨</span>
      <strong>Enter Setup Key</strong>
      <small>Enter the secret key and account details manually.</small>
    </button>
  </div>

  <div class="field add-account-import">
    <label for="homeOtpUri">PASTE OTPAUTH URI</label>
    <input
      id="homeOtpUri"
      type="text"
      placeholder="otpauth://totp/..."
      autocomplete="off"
    />
    <button
      type="button"
      class="secondary"
      data-add-action="import"
    >
      Import OTP URI
    </button>
  </div>
</section>
