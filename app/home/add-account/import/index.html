<section
  class="add-account-child import-page"
  data-feature="home-add-account-import"
>
  <button
    type="button"
    class="page-back"
    data-import-action="back"
  >
    <span aria-hidden="true">‹</span>
    <span>Back</span>
  </button>

  <div class="page-heading">
    <div>
      <p class="eyebrow">
        ADD ACCOUNT
      </p>
      <h1>
        Import OTPAUTH
      </h1>
      <p>
        Paste an <code>otpauth://</code> URI to continue.
      </p>
    </div>
  </div>

  <form
    id="otpAuthImportForm"
    class="import-form"
  >
    <div class="field">
      <label for="otpAuthUri">
        OTPAUTH URI
      </label>
      <textarea
        id="otpAuthUri"
        rows="6"
        placeholder="otpauth://totp/..."
        autocomplete="off"
        spellcheck="false"
        required
      ></textarea>
    </div>

    <p
      class="import-hint"
      id="otpAuthImportStatus"
    >
      The URI stays on this device until you save the account.
    </p>

    <button
      type="submit"
      class="primary"
    >
      Continue
    </button>
  </form>
</section>
