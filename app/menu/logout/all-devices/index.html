<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="all-devices"
>
  <div
    class="modal-head"
  >
    <h2>
      Log out on all devices
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Log out on all devices"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    This signs you out on this device. Remote session revocation requires server-side
    Firebase Admin support.
  </p>
  <div
    class="menu-feature-actions"
  >
    <button
      type="button"
      class="primary"
      id="confirmAllDevicesLogout"
    >
      Log out on all devices
    </button>
    <button
      type="button"
      class="secondary"
      data-close
    >
      Cancel
    </button>
  </div>
</section>
