<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="delete-local-data"
>
  <div
    class="modal-head"
  >
    <h2>
      Delete local data?
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Delete local data"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    This removes Indoone data stored on this device, including the encrypted
    vault and local sign-in markers. Your Indoone account and cloud data will
    not be deleted.
  </p>
  <div
    class="menu-feature-actions"
  >
    <button
      type="button"
      class="primary danger"
      id="confirmLocalDelete"
    >
      Delete local data
    </button>
    <button
      type="button"
      class="secondary"
      data-close
    >
      Cancel
    </button>
  </div>
</section>
