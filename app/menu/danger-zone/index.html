<section
  class="menu-feature-shell"
  data-menu-feature
  data-menu-section="danger-zone"
>
  <div
    class="modal-head"
  >
    <h2>
      Danger Zone
    </h2>
    <button
      type="button"
      class="close-btn"
      data-close
      aria-label="Close Danger Zone"
    >
      ×
    </button>
  </div>
  <p
    class="menu-feature-note"
  >
    These actions can permanently remove Indoone data. Continue only when you are sure.
  </p>
  <div
    class="menu-feature-list"
  >
    <button
      type="button"
      class="settings-row danger menu-feature-row"
      data-open-nested="danger-zone/delete-local-data"
    >
      <span>
        Delete local data
        <small>
          Remove data stored on this device
        </small>
      </span>
      <b>
        ›
      </b>
    </button>
    <button
      type="button"
      class="settings-row danger menu-feature-row"
      data-open-nested="danger-zone/delete-account"
    >
      <span>
        Delete Indoone account
        <small>
          Permanently delete your Indoone account and cloud data
        </small>
      </span>
      <b>
        ›
      </b>
    </button>
  </div>
</section>
