<section class="settings-subpage">
  <div class="modal-head">
    <h2>
      Change mobile number
    </h2>
    <button class="close-btn" type="button" data-close>
      ×
    </button>
  </div>
  <p>
    Update the mobile number saved to your Indoone account.
  </p>
  <div class="field">
    <label>Mobile number</label><input id="changeMobileNumber" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210">
  </div>
  <button class="primary" id="saveMobileNumber">
    Update mobile number
  </button>
</section>
