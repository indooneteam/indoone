<section class="settings-subpage">
  <div class="modal-head">
    <h2>
      Change email
    </h2>
    <button class="close-btn" type="button" data-close>
      ×
    </button>
  </div>
  <p>
    Change the email used for your Indoone account. Enter your current password to confirm.
  </p>
  <div class="field">
    <label>Email address</label><input id="changeEmail" type="email" autocomplete="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Current password</label><input
  id="changeEmailPassword"
  type="password"
  autocomplete="current-password"
  placeholder="Enter your current password">
  </div>
  <button class="primary" id="saveEmail">
    Change email
  </button>
</section>
