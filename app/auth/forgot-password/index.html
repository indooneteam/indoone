<section
  class="forgot-password-page"
  data-feature="forgot-password"
>
  <div class="auth-brand">
    <span class="auth-mark">I</span>
    <div>
      <strong>Indoone</strong>
      <small>Authenticator</small>
    </div>
  </div>

  <div class="auth-copy">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Forgot password?</h1>
    <p>
      Verify your email with the OTP, then choose a new password.
    </p>
  </div>

  <div class="field" id="forgotPasswordEmailField">
    <label>EMAIL ID</label>
    <input
      id="forgotPasswordEmail"
      type="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      placeholder="you@example.com"
    />
  </div>

  <button
    type="button"
    class="primary"
    id="forgotPasswordContinue"
  >
    Continue
  </button>

  <div
    id="forgotPasswordOtpArea"
    hidden
  >
    <p class="auth-otp-note">
      OTP sent to <strong id="forgotPasswordEmailLabel"></strong>
    </p>

    <div class="field">
      <label>VERIFICATION OTP</label>
      <input
        id="forgotPasswordOtp"
        name="one-time-code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
      />
    </div>

    <button
      type="button"
      class="primary"
      id="forgotPasswordVerify"
    >
      Verify OTP
    </button>
  </div>

  <div
    id="forgotPasswordResetArea"
    hidden
  >
    <p class="auth-otp-note">
      OTP verified. Choose a new password for your Indoone account.
    </p>

    <div class="field">
      <label>NEW PASSWORD</label>
      <input
        id="forgotPasswordNewPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        placeholder="Enter new password"
      />
    </div>

    <div class="field">
      <label>CONFIRM PASSWORD</label>
      <input
        id="forgotPasswordConfirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        placeholder="Confirm new password"
      />
    </div>

    <button
      type="button"
      class="primary"
      id="forgotPasswordSave"
    >
      Save Password
    </button>
  </div>

  <button
    type="button"
    class="secondary"
    id="forgotPasswordBack"
  >
    Back to Login
  </button>
</section>
