<section class="forgot-password-page" data-feature="forgot-password">
  <div class="auth-brand">
    <span class="auth-mark">I</span>
    <div><strong>Indoone</strong><small>Authenticator</small></div>
  </div>
  <div class="auth-copy">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Forgot password?</h1>
    <p>Enter your Indoone account email to continue resetting your password.</p>
  </div>
  <div class="field">
    <label>EMAIL ID</label>
    <input id="forgotPasswordEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" />
  </div>
  <button type="button" class="primary" id="forgotPasswordContinue">Continue</button>
  <button type="button" class="secondary" id="forgotPasswordBack">Back to Login</button>
</section>
