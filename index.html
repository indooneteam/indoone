<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Indoone Authenticator — private, offline-first authenticator demo." />
  <title>Indoone Authenticator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone-shell" id="app">
    <header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button><button class="brand" id="brandBtn" aria-label="Go to accounts"><span class="brand-mark">I</span><span><strong>Indoone</strong><small>Authenticator</small></span></button><div class="top-actions"><button class="icon-btn" id="searchBtn" aria-label="Search accounts">⌕</button><button class="icon-btn" id="moreBtn" aria-label="More options">⋮</button></div></header>
    <section class="search-wrap" id="searchWrap" hidden><div class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Search accounts" autocomplete="off" /><button id="clearSearch" aria-label="Clear search">×</button></div></section>
    <section class="content" id="content"><div class="page-heading"><div><p class="eyebrow">SECURE &amp; PRIVATE</p><h1>Your accounts</h1></div><button class="small-btn" id="sortBtn">Sort ↕</button></div><div class="account-list" id="accountList"></div><div class="empty-state" id="emptyState" hidden><div class="empty-icon">⌁</div><h3>No accounts found</h3><p>Add an account or try a different search.</p><button class="primary compact" id="emptyAddBtn">Add account</button></div></section>
    <button class="fab" id="addBtn" aria-label="Add account">+</button>
    <nav class="bottom-nav" aria-label="Main navigation"><button class="nav-btn active" id="accountsNav">⌂<span>Accounts</span></button><button class="nav-btn" id="settingsNav">⚙<span>Settings</span></button></nav>
  </main>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-backdrop" id="drawerBackdrop"></div><section class="drawer-panel"><div class="drawer-brand"><span class="brand-mark">I</span><div><strong>Indoone</strong><small>Authenticator</small></div></div><button class="drawer-item active" data-action="accounts">▦ <span>All Accounts</span><b id="drawerCount">0</b></button><button class="drawer-item" data-action="favorites">☆ <span>Favorites</span></button><button class="drawer-item" data-action="trash">♙ <span>Trash</span></button><div class="drawer-divider"></div><button class="drawer-item" data-action="security">◈ <span>Security</span></button><button class="drawer-item" data-action="backup">☁ <span>Backup</span></button><button class="drawer-item" data-action="settings">⚙ <span>Settings</span></button><button class="drawer-item" data-action="about">ⓘ <span>About Indoone</span></button><button class="drawer-item lock-item" data-action="lock">▣ <span>Lock App</span></button></section></aside>
  <div class="overlay hidden" id="overlay"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <div class="toast" id="toast" role="status"></div>
  <input id="recoveryFileInput" type="file" accept="application/pdf,.pdf" hidden />
  <script src="js/core.js"></script><script src="js/state.js"></script><script src="js/totp.js"></script><script src="js/vault.js"></script><script src="js/encrypted-vault.js"></script><script src="js/secure-session.js"></script><script src="js/persistence.js"></script><script src="js/recovery-pdf.js"></script><script src="js/menu.js"></script><script src="js/search.js"></script><script src="js/add-account.js"></script><script src="js/manual-account.js"></script><script src="js/totp-controller.js"></script><script src="js/account.js"></script><script src="js/account-actions.js"></script><script src="js/favorite.js"></script><script src="js/settings.js"></script><script src="js/app-lock.js"></script><script src="js/backup.js"></script><script src="js/navigation.js"></script><script src="js/drawer.js"></script><script src="js/events.js"></script>
</body>
</html>
